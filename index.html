<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aboud's Tasks</title>
  <meta name="description" content="Aboud's to-do list">
  <meta name="theme-color" content="#faf9f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11100f" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tasks">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div class="auth" id="auth" hidden>
  <div class="card">
    <h1>Aboud's Tasks</h1>
    <form id="loginForm" style="display:flex;flex-direction:column;gap:12px">
      <p id="loginMsg">Sign in to see your tasks.</p>
      <input id="email" type="email" inputmode="email" autocomplete="username" placeholder="Email" aria-label="Email" required>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password" required minlength="8">
      <button class="btn" type="submit" id="loginBtn">Sign in</button>
      <button class="link-btn" type="button" id="modeBtn">First time here? Create your account</button>
      <button class="link-btn" type="button" id="forgotBtn">Forgot password?</button>
    </form>
    <form id="newPassForm" hidden style="display:flex;flex-direction:column;gap:12px">
      <p>Choose a new password.</p>
      <input id="newPass" type="password" autocomplete="new-password" placeholder="New password (8+ characters)" aria-label="New password" required minlength="8">
      <button class="btn" type="submit" id="newPassBtn">Save password</button>
    </form>
    <p class="note" id="authOk" hidden></p>
    <p class="err" id="authErr" hidden></p>
  </div>
</div>

<div class="app" id="app" hidden>
  <main class="main">
    <div class="wrap">
      <header>
        <div>
          <h1>Aboud's Tasks</h1>
          <p id="today"></p>
        </div>
        <div class="tools">
          <label class="search">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
            <input id="search" type="search" placeholder="Search" aria-label="Search tasks" autocomplete="off">
            <button class="x" id="searchClear" type="button" hidden aria-label="Clear search"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
          </label>
          <button class="icon" id="bellBtn" type="button" aria-label="Turn on notifications" title="Notifications"></button>
          <button class="icon" id="signOutBtn" type="button" aria-label="Sign out" title="Sign out"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5H3.5v11H6M10 5l3 3-3 3M13 8H6.5"/></svg></button>
        </div>
      </header>
      <form class="add" id="addForm" autocomplete="off">
        <span class="plus" aria-hidden="true">+</span>
        <input id="addInput" placeholder="Add a task" aria-label="Add a task" maxlength="300">
        <button class="go" id="addGo" type="submit" hidden>Add</button>
      </form>
      <div id="list" class="list" aria-live="polite"></div>
      <button class="group-btn" id="doneToggle" hidden aria-expanded="false">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 2l4 4-4 4"/></svg>
        Completed <span class="n" id="doneCount"></span>
      </button>
      <div id="doneList" class="list" hidden></div>
      <p class="note" id="status"></p>
    </div>
  </main>
  <aside class="panel" id="panel" hidden aria-label="Task details"></aside>
</div>
<section class="cal" id="calView" hidden aria-label="Calendar">
  <header class="cal-head">
    <div class="cal-top">
      <h1 id="calTitle">Calendar</h1>
      <div class="cal-nav">
        <button class="icon" id="calOutlook" type="button" aria-label="Outlook connection"></button>
        <button class="cal-today" id="calToday" type="button">Today</button>
        <button class="icon" id="calPrev" type="button" aria-label="Previous"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 3L5 8l5 5"/></svg></button>
        <button class="icon" id="calNext" type="button" aria-label="Next"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 3l5 5-5 5"/></svg></button>
      </div>
    </div>
    <div class="seg cal-views" id="calViews"></div>
    <p class="note" id="calStatus"></p>
  </header>
  <div class="cal-body" id="calBody"></div>
  <button class="fab" id="calNew" type="button" aria-label="New event"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
</section>
<div class="sheet" id="evSheet" hidden></div>
<div class="choice" id="calChoice" hidden></div>
<nav class="tabbar" id="tabbar" hidden>
  <button type="button" data-tab="tasks"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7.5"/><path d="M6.8 10.2l2.2 2.2 4.3-4.6"/></svg><span>Tasks</span></button>
  <button type="button" data-tab="cal"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="2.5" y="3.5" width="15" height="14" rx="2"/><path d="M2.5 7.5h15M6.5 2v3M13.5 2v3" stroke-linecap="round"/><path d="M6 11h2M9 11h2M12 11h2M6 14h2M9 14h2" stroke-linecap="round"/></svg><span>Calendar</span></button>
</nav>
<div class="saving" id="saving">Saved</div>
<div class="toast" id="toast" hidden role="status"><span id="toastMsg"></span><button id="toastBtn" type="button">Undo</button><div class="bar" id="toastBar"></div></div>
<div class="viewer" id="viewer" hidden role="dialog" aria-label="File preview"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
